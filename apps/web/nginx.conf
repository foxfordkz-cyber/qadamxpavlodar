# Only expose this listener on loopback. The approved TLS edge must overwrite
# X-Forwarded-Proto (never append/trust a client-provided value).
map $http_x_forwarded_proto $external_scheme {
  default $scheme;
  https https;
}
map $external_scheme $session_secure {
  default nosecure;
  https secure;
}
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Маршруты хешевые (#/map), поэтому достаточно отдавать index.html.
  location / { try_files $uri $uri/ /index.html; }
  location = /health { proxy_pass http://server:3100/health; proxy_set_header Host localhost; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Сервер в compose (SRV-03). Имя разрешается при запросе: веб стартует и без сервера, /api тогда отвечает 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://server:3100;
  location /api/ {
    proxy_pass $api_upstream;
    # Сервер сверяет Host (ALLOWED_HOSTS) и Origin с ним — передаём исходный Host с портом.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_cookie_flags gp_v2_session $session_secure httponly samesite=strict;
    client_max_body_size 6m;
    proxy_read_timeout 30s;
  }
  location /api-docs/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $http_host;
  }
}
