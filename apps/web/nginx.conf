server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Маршруты хешевые (#/map), поэтому достаточно отдавать index.html.
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  client_max_body_size 8m;
  location /api/ { proxy_pass http://server:3100; proxy_set_header Host $http_host; }
  location /api-docs/ { proxy_pass http://server:3100; proxy_set_header Host $http_host; }
  location /health { proxy_pass http://server:3100; proxy_set_header Host $http_host; }
}
