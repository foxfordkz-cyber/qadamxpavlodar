server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Маршруты хешевые (#/map), поэтому достаточно отдавать index.html.
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Сервер в compose (SRV-03). Имя разрешается при запросе: веб стартует и без сервера, /api тогда отвечает 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://server:3100;
  location /api/ {
    proxy_pass $api_upstream;
    # Сервер сверяет Host (ALLOWED_HOSTS) и Origin с ним — передаём исходный Host с портом.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
    proxy_read_timeout 30s;
  }
  location /api-docs/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $http_host;
  }
}
