# Запуск одной командой (ТЗ 4): docker compose up --build → http://localhost:8080
# Необязательный apps/server/.env передаётся серверу через env_file, а не в образ.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # По умолчанию данные mock; API выбирается явно через URL.
        # Режим можно сменить и без пересборки: http://localhost:8080/?source=api
        DATA_SOURCE: ${DATA_SOURCE:-mock}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      STORAGE_ROOT: /data
      TRUST_PROXY: uniquelocal
    volumes:
      - gp-data:/data
    deploy:
      replicas: 1
    stop_grace_period: 30s
    # Наружу не публикуется: браузер ходит через nginx (/api → server:3100).
    expose:
      - "3100"
    restart: unless-stopped
volumes:
  gp-data:
